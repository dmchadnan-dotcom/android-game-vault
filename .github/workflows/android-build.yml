name: Build Android Game Vault
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK: ${ANDROID_HOME:-not-set}"
          test -d "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            test -n "$SDKMGR"
            yes | "$SDKMGR" --licenses >/dev/null || true
            "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"
          fi
          ls "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Indie-Game-Vault-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
