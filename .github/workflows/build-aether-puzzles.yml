name: Build Aether Puzzle Worlds APK and AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'aether-puzzles/**'
      - '.github/workflows/build-aether-puzzles.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: aether-puzzles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 36
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            test -n "$SDKMGR"
            "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify game source
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/brightforge/aetherpuzzles/MainActivity.java
      - name: Compile debug APK and unsigned release AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Puzzle-Worlds-Android-Debug-APK
          path: aether-puzzles/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned bundle
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Puzzle-Worlds-Unsigned-AAB-Not-for-Play
          path: aether-puzzles/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
