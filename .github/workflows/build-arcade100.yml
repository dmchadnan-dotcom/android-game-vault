name: Arcade Atlas 100 Android Builds
on:
  workflow_dispatch:
  push:
    paths:
      - 'arcade-100/**'
      - '.github/workflows/build-arcade100.yml'
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: arcade-100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36 if necessary
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            test -n "$SDKMGR"
            "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore full source package
        shell: bash
        run: |
          set -euo pipefail
          cat project_payload.b64.part* | base64 -d > /tmp/arcade-atlas-project.zip
          unzip -o -q /tmp/arcade-atlas-project.zip -d .
          test -f app/src/main/assets/catalog.js
          test -f app/src/main/assets/ui.js
      - name: Build test APK and release AAB
        shell: bash
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Save test APK
        uses: actions/upload-artifact@v4
        with:
          name: Arcade-Atlas-100-Debug-APK
          path: arcade-100/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Save unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: Arcade-Atlas-100-Unsigned-AAB-Not-For-Play
          path: arcade-100/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Check configured signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ARCADE100_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.ARCADE100_STORE_PASSWORD }}
          KEYALIAS: ${{ secrets.ARCADE100_KEY_ALIAS }}
          KEYPASS: ${{ secrets.ARCADE100_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STOREPASS" ] && [ -n "$KEYALIAS" ] && [ -n "$KEYPASS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed release AAB
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE: ${{ secrets.ARCADE100_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ARCADE100_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ARCADE100_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ARCADE100_KEY_PASSWORD }}
        shell: bash
        run: |
          printf %s "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload-key.jks"
          gradle --no-daemon :app:bundleRelease
          rm -f "$RUNNER_TEMP/upload-key.jks"
      - name: Save Play-signed upload AAB
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Arcade-Atlas-100-Signed-Upload-AAB
          path: arcade-100/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
