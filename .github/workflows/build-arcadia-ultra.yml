name: Build Arcadia Ultra APK and AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'arcadia-ultra/**'
      - '.github/workflows/build-arcadia-ultra.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: arcadia-ultra/android-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK API 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            test -n "$SDKMGR"
            "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate bundled games
        run: |
          test -s app/src/main/assets/index.html
          grep -q 'HYPERLANE DRIFT' app/src/main/assets/index.html
          grep -q 'STARFALL DEFENDER' app/src/main/assets/index.html
          grep -q 'AEGIS TOWERS' app/src/main/assets/index.html
      - name: Build APK and unsigned AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Arcadia-Ultra-Android-Debug-APK
          path: arcadia-ultra/android-studio/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Arcadia-Ultra-Unsigned-AAB-Not-Play-Ready
          path: arcadia-ultra/android-studio/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
