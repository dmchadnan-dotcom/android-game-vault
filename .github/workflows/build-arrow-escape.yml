name: Build Arrow Escape Android APK and AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'arrow-escape/**'
      - '.github/workflows/build-arrow-escape.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: arrow-escape/android-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36 if needed
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            test -n "$SDKMGR"
            "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify game source
        run: test -s app/src/main/assets/index.html
      - name: Build debug APK and unsigned release AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-Studio-Debug-APK
          path: arrow-escape/android-studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Arrow-Escape-Studio-Unsigned-AAB
          path: arrow-escape/android-studio/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
