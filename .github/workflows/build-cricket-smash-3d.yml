name: Build Cricket Smash 3D APK and AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cricket-smash-3d/**'
      - '.github/workflows/build-cricket-smash-3d.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cricket-smash-3d/android-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            test -n "$SDKMGR"
            "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate packaged game
        run: |
          test -s app/src/main/assets/index.html
          grep -q 'CricketSmashTest' app/src/main/assets/index.html
      - name: Build debug APK and unsigned AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Smash-3D-Debug-APK
          path: cricket-smash-3d/android-studio/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: Cricket-Smash-3D-Unsigned-AAB-Not-for-Play
          path: cricket-smash-3d/android-studio/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
