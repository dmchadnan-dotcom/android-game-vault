name: Build Grandmaster Arena Chess APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'grandmaster-chess/**'
      - '.github/workflows/build-grandmaster-chess.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: grandmaster-chess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Confirm Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            test -n "$SDKMGR"
            "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check game source
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/brightforge/grandmasterarena/MainActivity.java
      - name: Build debug APK and unsigned AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Grandmaster-Arena-Chess-Debug-APK
          path: grandmaster-chess/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Upload unsigned AAB for inspection
        uses: actions/upload-artifact@v4
        with:
          name: Grandmaster-Arena-Chess-Unsigned-AAB-NOT-PLAY-READY
          path: grandmaster-chess/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error
