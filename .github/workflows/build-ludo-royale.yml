name: Build Ludo Royale Android APK and AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ludo-royale/**'
      - '.github/workflows/build-ludo-royale.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ludo-royale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            test -n "$SDKMGR"
            "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check game source
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/brightforge/ludoroyale/MainActivity.java
      - name: Build debug APK and unsigned AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Royale-Android-Debug-APK
          path: ludo-royale/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Royale-Unsigned-AAB-Not-for-Play
          path: ludo-royale/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
