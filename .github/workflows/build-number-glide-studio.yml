name: Build Number Glide Studio APK and AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'number-glide-studio/**'
      - '.github/workflows/build-number-glide-studio.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: number-glide-studio/android-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            test -n "$SDKMGR"
            "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check bundled game
        run: test -s app/src/main/assets/index.html
      - name: Compile debug APK and unsigned AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: number-glide-studio-debug-apk
          path: number-glide-studio/android-studio/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Save unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: number-glide-studio-unsigned-aab
          path: number-glide-studio/android-studio/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
