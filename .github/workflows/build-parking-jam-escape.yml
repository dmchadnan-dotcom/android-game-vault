name: Build Parking Jam Escape APK and AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'parking-jam-escape/**'
      - '.github/workflows/build-parking-jam-escape.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: parking-jam-escape/android-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -n "$SDKMGR"
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate packaged game
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/brightforge/parkingjamescape/MainActivity.java
          if grep -Eq '<script[^>]*src=|<link[^>]*href="https?://' app/src/main/assets/index.html; then echo 'Remote dependency found'; exit 1; fi
      - name: Build debug APK and unsigned release bundle
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Parking-Jam-Escape-Android-Debug-APK
          path: parking-jam-escape/android-studio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Parking-Jam-Escape-Unsigned-AAB-Not-For-Play
          path: parking-jam-escape/android-studio/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
