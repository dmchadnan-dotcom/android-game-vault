name: Build Royal Chess Studio (APK and AAB)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'royal-chess/**'
      - '.github/workflows/build-royal-chess.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: royal-chess
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            test -n "$SDKMGR"
            "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify bundled game source
        run: |
          test -s app/src/main/assets/index.html
          grep -q 'ChessCore' app/src/main/assets/index.html
          grep -q 'com.brightforge.royalchess' app/build.gradle
      - name: Compile APK and unsigned AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Royal-Chess-Android-Test-APK
          path: royal-chess/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Royal-Chess-Unsigned-Release-AAB-Not-For-Play
          path: royal-chess/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
