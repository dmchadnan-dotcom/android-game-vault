name: Build Snake Ladders Royale APK and AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'snake-ladders-royale/**'
      - '.github/workflows/build-snake-ladders-royale.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: snake-ladders-royale/android-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android 36 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify offline game assets
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/brightforge/snakeladdersroyale/MainActivity.java
          if grep -qi 'http.*\.js' app/src/main/assets/index.html; then echo 'Unexpected remote JS'; exit 1; fi
      - name: Compile Android debug APK and unsigned release AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Snake-Ladders-Royale-Debug-APK
          path: snake-ladders-royale/android-studio/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Snake-Ladders-Royale-Unsigned-AAB-NOT-PLAY-READY
          path: snake-ladders-royale/android-studio/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
