name: Build Tenfold Arcade APK and AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'commercial-ten/app/**'
      - 'commercial-ten/build.gradle'
      - 'commercial-ten/settings.gradle'
      - 'commercial-ten/gradle.properties'
      - '.github/workflows/build-tenfold.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: commercial-ten
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            test -n "$SDKMGR"
            "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check source completeness
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/brightforge/tenfold/MainActivity.java
          test -s app/src/main/AndroidManifest.xml
      - name: Compile test APK and unsigned Play bundle
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: Tenfold-Arcade-Debug-APK
          path: commercial-ten/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned AAB for inspection only
        uses: actions/upload-artifact@v4
        with:
          name: Tenfold-Arcade-Unsigned-AAB-NOT-PLAY-READY
          path: commercial-ten/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
