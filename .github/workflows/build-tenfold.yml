name: Build Tenfold Arcade APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'commercial-ten/**'
      - '.github/workflows/build-tenfold.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
            test -n "$SDKMGR"
            "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble Tenfold Android app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/src/main/assets/games
          cp commercial-ten/index.html app/src/main/assets/index.html
          mkdir -p app/src/main/res/drawable
          cp commercial-ten/tenfold_icon.xml app/src/main/res/drawable/tenfold_icon.xml
          sed -i "s/applicationId 'com.brightforge.gamevault'/applicationId 'com.brightforge.tenfold'/g" app/build.gradle
          sed -i 's/android:label="Indie Game Vault"/android:label="Tenfold Arcade"/' app/src/main/AndroidManifest.xml
          sed -i 's|android:icon="@android:drawable/sym_def_app_icon"|android:icon="@drawable/tenfold_icon"|' app/src/main/AndroidManifest.xml
          grep 'com.brightforge.tenfold' app/build.gradle
          grep 'Tenfold Arcade' app/src/main/AndroidManifest.xml
          test -s app/src/main/assets/index.html
      - name: Build debug APK and unsigned release AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tenfold-Arcade-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned AAB for inspection only
        uses: actions/upload-artifact@v4
        with:
          name: Tenfold-Arcade-Unsigned-AAB-Not-For-Play
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
