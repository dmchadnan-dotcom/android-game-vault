name: Publish Tenfold store PNGs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "commercial-ten/scripts/generate_store_media.py"
      - ".github/workflows/tenfold-store-media.yml"
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install screenshot tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pillow cairosvg
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install --with-deps chromium
          fi
      - name: Capture real gameplay and store PNG assets
        run: python commercial-ten/scripts/generate_store_media.py
      - name: Commit PNG files to repository
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commercial-ten/store/screenshots/*.png
          git add commercial-ten/store/icon_512.png commercial-ten/store/feature_graphic_1024x500.png
          if git diff --cached --quiet; then
            echo "Store graphics already up to date."
          else
            git commit -m "Add generated authentic Tenfold PNG screenshots and Play Store graphics"
            git push origin HEAD:main
          fi
      - name: Preserve screenshots as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tenfold-Store-PNGs
          path: |
            commercial-ten/store/screenshots/*.png
            commercial-ten/store/icon_512.png
            commercial-ten/store/feature_graphic_1024x500.png
          if-no-files-found: error
