plugins { id 'com.android.application' }
android {
    namespace 'com.brightforge.tenfold'
    compileSdk 36
    defaultConfig {
        applicationId 'com.brightforge.tenfold'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    signingConfigs {
        release {
            def storePath = System.getenv('ANDROID_KEYSTORE_PATH')
            def storePass = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def alias = System.getenv('ANDROID_KEY_ALIAS')
            def keyPass = System.getenv('ANDROID_KEY_PASSWORD')
            if (storePath && storePass && alias && keyPass) {
                storeFile file(storePath)
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH') &&
                System.getenv('ANDROID_KEYSTORE_PASSWORD') &&
                System.getenv('ANDROID_KEY_ALIAS') &&
                System.getenv('ANDROID_KEY_PASSWORD')) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
