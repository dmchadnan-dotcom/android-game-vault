<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e20"><title>NEON XO — Tic Tac Toe Arena</title>
<style>
:root{font-family:Inter,'Segoe UI',system-ui,-apple-system,sans-serif;color:#f4f8ff;background:#080d1c;--line:#293653;--soft:#91a1c1;--cyan:#55e9ed;--rose:#ff779e;--glass:#131d35}*{box-sizing:border-box}html,body{min-width:270px;margin:0;min-height:100%;overscroll-behavior:none}body{background:radial-gradient(ellipse 85% 45% at 50% -10%,#294577 0%,transparent 74%),radial-gradient(ellipse 65% 30% at 0% 80%,#182346 0%,transparent 85%),#080d1c}button,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,select:focus-visible{outline:3px solid #e7d9ff;outline-offset:3px}header{padding:24px 20px 9px;max-width:560px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px}.logo{font-weight:1000;font-size:23px;letter-spacing:-.11em;width:46px;height:46px;display:grid;place-items:center;border:1px solid #57617f;border-radius:15px;background:#152443;box-shadow:0 8px 28px #0005}.logo .x{color:var(--cyan)}.logo .o{color:var(--rose)}.brand h1{font-size:19px;margin:0;letter-spacing:.12em}.brand small{display:block;font-size:10px;letter-spacing:.24em;color:#9eadd0;margin-top:3px}.iconbutton{width:42px;height:42px;border:1px solid #354562;border-radius:14px;background:#1b2945;color:#dfeaff;font-size:18px}.wrap{max-width:560px;margin:0 auto;padding:8px 18px 36px}.panel{background:linear-gradient(150deg,#1a2943e8,#101a30ed);border:1px solid #334564;box-shadow:0 17px 44px #0006,inset 0 1px #ffffff0b;border-radius:24px}.modepanel{padding:16px;margin-bottom:14px}.label{font-size:10px;font-weight:850;letter-spacing:.2em;color:#93a9cd;text-transform:uppercase;margin-bottom:9px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#0c1528;padding:5px;border:1px solid #263654;border-radius:14px}.seg button{border:0;background:none;color:#8fa1c2;font-size:13px;font-weight:800;padding:12px 4px;border-radius:10px}.seg button.active{background:linear-gradient(110deg,#294966,#34496f);color:#fff;box-shadow:0 3px 8px #0005}.row{display:flex;gap:10px;align-items:end;margin-top:13px}.selectbox{flex:1;min-width:0}.selectbox select{width:100%;appearance:none;background:#101a31;border:1px solid #344766;border-radius:12px;color:#f4f8ff;padding:12px 10px;font-size:13px;font-weight:750}.selectbox:after{content:'⌄';pointer-events:none;float:right;margin-top:-30px;margin-right:10px;color:#b8c7df;position:relative}.scores{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:15px 15px;margin-bottom:12px}.player{display:flex;align-items:center;gap:10px}.player.right{justify-content:flex-end;flex-direction:row-reverse;text-align:right}.avatar{width:46px;height:46px;border-radius:14px;background:#0b263c;border:1px solid #24656b;display:grid;place-items:center;font-size:26px;font-weight:900;color:var(--cyan);text-shadow:0 0 18px #55e9ed88}.avatar.o{background:#34213a;border-color:#734362;color:var(--rose);text-shadow:0 0 18px #ff779e88}.ptitle{font-size:11px;color:#9bacc9;font-weight:700}.points{font-size:27px;font-weight:950;line-height:1.1}.vs{font-size:10px;color:#8192ae;font-weight:850;letter-spacing:.1em}.arena{position:relative;padding:15px 15px 19px;border-radius:26px;overflow:hidden}.topstatus{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:3px 3px 15px}.pill{background:#101e35;border:1px solid #38526f;border-radius:50px;color:#d1e2f9;font-size:12px;font-weight:850;padding:8px 11px}.pill span{color:var(--cyan)}.turn{font-size:13px;font-weight:850;color:#dce9ff;text-align:right}.turn .t-x{color:var(--cyan)}.turn .t-o{color:var(--rose)}.board-wrap{padding:8px 0 2px;display:flex;justify-content:center;position:relative}.board{--cols:3;width:min(100%,430px);aspect-ratio:1;display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:9px;padding:9px;background:#0a1328;border:1px solid #39506e;border-radius:22px;box-shadow:0 13px 29px #030612aa,inset 0 0 24px #101e42;position:relative}.cell{border:1px solid #26395a;background:linear-gradient(140deg,#192b48,#111c34);border-radius:16px;display:grid;place-items:center;position:relative;color:#fff;aspect-ratio:1;transition:transform .12s,border-color .15s,background .15s;padding:0}.cell:active{transform:scale(.96)}.cell:not(:disabled):hover{background:#233b5b;border-color:#577a9a}.cell:disabled{cursor:default}.mark{font-weight:800;font-size:clamp(42px,13vw,80px);line-height:1;opacity:1;animation:pop .2s cubic-bezier(.25,1.8,.5,1)}.board.four .mark{font-size:clamp(31px,9vw,60px)}.mark.x{color:#5aeafa;text-shadow:0 0 25px #18dfe777}.mark.o{color:#ff80ab;text-shadow:0 0 25px #ff568177}.cell.win{background:#253f56;border-color:#ffe0a5;box-shadow:inset 0 0 30px #f4c77630}.cell.win .mark{color:#ffe4a8;text-shadow:0 0 25px #ffd489}.board .cell.last{border-color:#6582ac}.status{text-align:center;color:#bac9e0;font-size:12px;font-weight:650;min-height:20px;padding:13px 5px 1px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.action{padding:14px 8px;background:#172640;border:1px solid #405374;color:#dfecff;border-radius:15px;font-weight:850;font-size:13px}.action.primary{color:#08182d;border:0;background:linear-gradient(100deg,#65f0e5,#90bcff)}.action:disabled{opacity:.4;cursor:not-allowed}.footer{text-align:center;font-size:11px;color:#8292b0;margin-top:18px;line-height:1.8}.modal-backdrop{position:fixed;inset:0;background:#030917dd;display:grid;place-items:center;padding:16px;z-index:5;backdrop-filter:blur(8px)}.modal{width:min(100%,365px);background:#142541;border:1px solid #496087;border-radius:25px;padding:28px;text-align:center;box-shadow:0 30px 80px #000c}.modal h2{margin:5px 0 10px;font-size:27px}.modal p{color:#bbcce6;font-size:14px;line-height:1.6;margin-bottom:22px}.modal .action{width:100%;margin-top:10px}.hidden{display:none!important}@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:385px){.wrap{padding:6px 11px 28px}.modepanel{padding:12px}.arena{padding:10px}.board{gap:6px;padding:7px;border-radius:17px}.cell{border-radius:12px}.scores{padding:12px 10px}.avatar{width:39px;height:39px}.ptitle{font-size:10px}.points{font-size:23px}header{padding:17px 12px 8px}.selectbox select{font-size:12px}}
</style></head><body>
<header><div class="brand"><div class="logo"><span class="x">X</span><span class="o">O</span></div><div><h1>NEON XO</h1><small>THE ARENA SERIES</small></div></div><button id="soundButton" class="iconbutton" aria-label="Toggle sound" title="Sound">♪</button></header>
<main class="wrap">
<section class="panel modepanel"><div class="label">Play mode</div><div class="seg" role="group" aria-label="Choose opponent"><button id="botMode" class="active" aria-pressed="true">✦ VS COMPUTER</button><button id="localMode" aria-pressed="false">♙ 2 PLAYERS</button></div><div class="row"><label class="selectbox"><div class="label">Board type</div><select id="boardSize"><option value="3">Classic · 3×3</option><option value="4">Extended · 4×4</option></select></label><label class="selectbox" id="difficultyBox"><div class="label">Bot difficulty</div><select id="difficulty"><option value="easy">Rookie</option><option value="medium">Skilled</option><option value="hard" selected>Master</option></select></label></div></section>
<section class="panel scores"><div class="player"><div class="avatar">✕</div><div><div class="ptitle" id="xName">YOU · X</div><div class="points" id="xScore">0</div></div></div><div class="vs">VS<br><span id="draws">0 draws</span></div><div class="player right"><div class="avatar o">◯</div><div><div class="ptitle" id="oName">BOT · O</div><div class="points" id="oScore">0</div></div></div></section>
<section class="panel arena"><div class="topstatus"><span class="pill" id="roundLabel">ROUND <span>01</span></span><span class="turn" id="turn">YOUR TURN <span class="t-x">✕</span></span></div><div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Tic Tac Toe game board"></div></div><div class="status" id="status" aria-live="polite">Choose any square to start your match.</div></section>
<div class="actions"><button id="undo" class="action">↶ UNDO MOVE</button><button id="newRound" class="action primary">↻ NEW ROUND</button></div>
<div class="footer">No sign-in. No network. Just great games.<br>Made for quick offline play on one phone.</div></main>
<div class="modal-backdrop hidden" id="winnerModal" role="dialog" aria-modal="true" aria-label="Round result"><div class="modal"><div style="font-size:38px" id="modalIcon">🏆</div><h2 id="modalTitle">Victory!</h2><p id="modalText">Brilliant game.</p><button id="modalNext" class="action primary">PLAY AGAIN →</button><button id="modalClose" class="action">VIEW BOARD</button></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);const B=$('#board');let mode='bot',size=3,difficulty='hard',board=Array(9).fill(''),turn='X',over=false,winning=[],history=[],last=-1,round=1,stats={X:0,O:0,D:0},generation=0,botTimer=0,sound=true,modalTimer=0;
const storeKey='neon_xo_arena_2026';try{let saved=JSON.parse(localStorage.getItem(storeKey)||'null');if(saved){stats=saved.stats||stats;round=saved.round||1;mode=saved.mode||'bot';size=saved.size===4?4:3;difficulty=saved.difficulty||'hard';sound=saved.sound!==false;}}catch{}
function persist(){try{localStorage.setItem(storeKey,JSON.stringify({stats,round,mode,size,difficulty,sound}))}catch{}}
function beep(f=440,d=.07){if(!sound)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;window.__audio=window.__audio||new C();let c=window.__audio,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.055,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+d)}catch{}}
function lines(n){let out=[];for(let r=0;r<n;r++){out.push(Array.from({length:n},(_,i)=>r*n+i))}for(let c=0;c<n;c++)out.push(Array.from({length:n},(_,i)=>i*n+c));out.push(Array.from({length:n},(_,i)=>i*n+i));out.push(Array.from({length:n},(_,i)=>i*n+(n-i-1)));return out}
function result(state,n){let ls=lines(n);for(let combo of ls){let first=state[combo[0]];if(first&&combo.every(i=>state[i]===first))return{winner:first,line:combo}};if(state.every(Boolean))return{winner:'D',line:[]};return null}
function legal(state){let out=[];state.forEach((v,i)=>{if(!v)out.push(i)});return out}
function minimax(state,player,alpha,beta,depth,limit,n){let r=result(state,n);if(r)return{value:r.winner==='O'?200+depth:r.winner==='X'?-200-depth:0,index:-1};if(depth===0)return{value:evaluate(state,n),index:-1};let avail=legal(state),ordered=avail.sort((a,b)=>priority(b,n)-priority(a,n)),max=player==='O',best={value:max?-Infinity:Infinity,index:ordered[0]};for(let i of ordered){state[i]=player;let z=minimax(state,max?'X':'O',alpha,beta,depth-1,limit,n).value;state[i]='';if(max?z>best.value:z<best.value)best={value:z,index:i};if(max)alpha=Math.max(alpha,best.value);else beta=Math.min(beta,best.value);if(beta<=alpha)break}return best}
function priority(i,n){let m=(n-1)/2;return 20-(Math.abs(Math.floor(i/n)-m)+Math.abs(i%n-m))*3}
function evaluate(st,n){let score=0;for(let ls of lines(n)){let x=0,o=0;for(let j of ls){if(st[j]==='X')x++;else if(st[j]==='O')o++}if(x&&o)continue;if(o)score+=Math.pow(6,o);if(x)score-=Math.pow(6,x)}return score}
function findBotMove(){let options=legal(board);if(!options.length)return -1;if(difficulty==='easy')return options[Math.floor(Math.random()*options.length)];for(let i of options){board[i]='O';let r=result(board,size);board[i]='';if(r&&r.winner==='O')return i}if(difficulty==='medium'&&Math.random()<.3)return options[Math.floor(Math.random()*options.length)];for(let i of options){board[i]='X';let r=result(board,size);board[i]='';if(r&&r.winner==='X')return i}if(difficulty==='medium')return options.sort((a,b)=>priority(b,size)-priority(a,size))[Math.floor(Math.random()*Math.min(3,options.length))];let depth=size===3?options.length:Math.min(4,options.length);return minimax(board,'O',-Infinity,Infinity,depth,depth,size).index}
function cancelBot(){generation++;clearTimeout(botTimer);clearTimeout(modalTimer)}
function selectCell(i){if(over||board[i]||(mode==='bot'&&turn==='O'))return;makeMove(i)}
function makeMove(i){if(over||board[i])return;history.push({board:board.slice(),turn,over,winning:winning.slice(),last});board[i]=turn;last=i;beep(turn==='X'?490:375);let r=result(board,size);if(r){over=true;winning=r.line;stats[r.winner]=(stats[r.winner]||0)+1;persist();render();if(r.winner==='D'){$('#status').textContent='A perfect draw — nice match!';beep(280,.23)}else{$('#status').textContent=(r.winner==='X'?(mode==='bot'?'You win!':'Player X wins!'):(mode==='bot'?'Computer wins!':'Player O wins!'));beep(760,.3)}const g=generation;modalTimer=setTimeout(()=>{if(g===generation)showResult(r.winner)},670);return}turn=turn==='X'?'O':'X';render();if(mode==='bot'&&turn==='O'){let g=generation;botTimer=setTimeout(()=>{if(g===generation&&!over&&turn==='O'){let move=findBotMove();if(move>=0)makeMove(move)}},340)}}
function render(){B.style.setProperty('--cols',size);B.classList.toggle('four',size===4);B.replaceChildren();board.forEach((value,i)=>{let b=document.createElement('button');b.type='button';b.className='cell'+(winning.includes(i)?' win':'')+(last===i?' last':'');b.setAttribute('role','gridcell');b.setAttribute('aria-label',`Row ${Math.floor(i/size)+1}, column ${i%size+1}, ${value||'empty'}`);b.disabled=over||!!value||(mode==='bot'&&turn==='O');if(value){let span=document.createElement('span');span.className='mark '+value.toLowerCase();span.textContent=value==='X'?'✕':'◯';b.append(span)}b.addEventListener('click',()=>selectCell(i));B.append(b)});$('#xScore').textContent=stats.X;$('#oScore').textContent=stats.O;$('#draws').textContent=stats.D+' draws';$('#xName').textContent=mode==='bot'?'YOU · X':'PLAYER 1 · X';$('#oName').textContent=mode==='bot'?'BOT · O':'PLAYER 2 · O';$('#turn').innerHTML=over?'ROUND COMPLETE':mode==='bot'?(turn==='O'?'BOT THINKING <span class="t-o">◯</span>':'YOUR TURN <span class="t-x">✕</span>'):(turn==='X'?'PLAYER 1 <span class="t-x">✕</span>':'PLAYER 2 <span class="t-o">◯</span>');$('#roundLabel').innerHTML='ROUND <span>'+String(round).padStart(2,'0')+'</span>';$('#undo').disabled=history.length===0;$('#botMode').classList.toggle('active',mode==='bot');$('#localMode').classList.toggle('active',mode==='local');$('#botMode').setAttribute('aria-pressed',mode==='bot');$('#localMode').setAttribute('aria-pressed',mode==='local');$('#difficultyBox').classList.toggle('hidden',mode==='local');$('#boardSize').value=String(size);$('#difficulty').value=difficulty;$('#soundButton').textContent=sound?'♫':'♩';$('#soundButton').setAttribute('aria-pressed',sound?'true':'false');if(!over)$('#status').textContent=mode==='bot'?'Beat the AI — think ahead and connect '+size+'.':'Pass the phone to '+(turn==='X'?'Player 1':'Player 2')+'. Connect '+size+' to win.'}
function newRound(advance=true){cancelBot();$('#winnerModal').classList.add('hidden');board=Array(size*size).fill('');turn='X';over=false;winning=[];history=[];last=-1;if(advance)round++;persist();render()}
function changeMode(v){mode=v;stats={X:0,O:0,D:0};round=1;newRound(false)}
function showResult(winner){$('#modalIcon').textContent=winner==='D'?'🤝':'🏆';$('#modalTitle').textContent=winner==='D'?'It’s a draw!':winner==='X'?(mode==='bot'?'You did it!':'Player 1 wins!'):(mode==='bot'?'AI takes this one':'Player 2 wins!');$('#modalText').textContent=winner==='D'?'Both players defended their squares. Try again!':winner==='O'&&mode==='bot'?'The bot found a winning line. Ready for a rematch?':'Brilliant strategy. One more round?';$('#winnerModal').classList.remove('hidden')}
$('#botMode').onclick=()=>changeMode('bot');$('#localMode').onclick=()=>changeMode('local');$('#boardSize').onchange=e=>{size=Number(e.target.value);stats={X:0,O:0,D:0};round=1;newRound(false)};$('#difficulty').onchange=e=>{difficulty=e.target.value;newRound(false)};$('#newRound').onclick=()=>newRound();$('#modalNext').onclick=()=>newRound();$('#modalClose').onclick=()=>$('#winnerModal').classList.add('hidden');$('#undo').onclick=()=>{cancelBot();$('#winnerModal').classList.add('hidden');if(!history.length)return;if(over){let r=result(board,size);if(r&&stats[r.winner]>0){stats[r.winner]--;persist()}}let steps=mode==='bot'&&turn==='X'&&history.length>=2?2:1;while(steps--&&history.length){let h=history.pop();board=h.board;turn=h.turn;over=h.over;winning=h.winning;last=h.last;}if(mode==='bot'&&turn==='O'&&history.length){let h=history.pop();board=h.board;turn=h.turn;over=h.over;winning=h.winning;last=h.last}render();beep(260)};$('#soundButton').onclick=()=>{sound=!sound;persist();render();beep(620)};
window.__neonXO={result,lines,minimax,evaluate,findBotMove,read:()=>({mode,size,board:board.slice(),turn,over,stats:{...stats},winning:winning.slice(),history:history.length}),click:i=>selectCell(i),reset:()=>newRound(false),changeMode};render();})();
</script></body></html>
